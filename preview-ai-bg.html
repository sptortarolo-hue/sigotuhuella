<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview AI Backgrounds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; font-family: Arial, sans-serif; padding: 30px; }
  h1 { color: #fff; text-align: center; font-size: 24px; margin-bottom: 8px; }
  .sub { color: #888; text-align: center; font-size: 14px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
  .card { display: flex; flex-direction: column; align-items: center; }
  .label { color: #aaa; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .canvas-wrap { position: relative; width: 240px; height: 300px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
  .canvas-wrap canvas { width: 100%; height: 100%; display: block; }
  input[type="file"] { display: none; }
  .btn { display: inline-block; margin-bottom: 24px; padding: 10px 28px; border: none; border-radius: 8px; background: #5A5A40; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
  .btn:hover { background: #4a4a33; }
  .tc { text-align: center; }
</style>
</head>
<body>
  <h1>AI Backgrounds Preview</h1>
  <p class="sub">16 combinaciones (8 estados × 2 especies) + foto mascota + barra estado + logo STH</p>
  <div class="tc">
    <label class="btn">Subir foto de prueba <input type="file" id="fileInput" accept="image/*"></label>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const W = 1080, H = 1350, BAR_H = 90, LOGO_SIZE = 80, LOGO_PAD = 16;
    let testImg = null;

    const COMBOS = [
      'perro-perdido','gato-perdido','perro-retenido','gato-retenido',
      'perro-avistado','gato-avistado','perro-adopcion','gato-adopcion',
      'perro-adoptado','gato-adoptado','perro-reencuentro','gato-reencuentro',
      'perro-accidentado','gato-accidentado','perro-atencion','gato-atencion',
    ];

    const STATUS = {
      perdido:['SE PERDIÓ','#EF4444'], retenido:['RETENIDO','#2563EB'],
      avistado:['AVISTADO','#2563EB'], adopcion:['EN ADOPCIÓN','#8B5CF6'],
      adoptado:['ADOPTADO','#10B981'], reencuentro:['REENCUENTRO','#10B981'],
      accidentado:['ACCIDENTADO','#EA580C'], atencion:['NECESITA ATENCIÓN','#D97706'],
    };

    document.getElementById('fileInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => { testImg = img; renderAll(); };
      img.src = URL.createObjectURL(file);
    };

    const bgCache = {};

    async function getBg(id) {
      if (bgCache[id]) return bgCache[id];
      return new Promise((res) => {
        const img = new Image();
        img.onload = () => { bgCache[id] = img; res(img); };
        img.onerror = () => res(null);
        img.src = `public/ai-bg/${id}.png`;
      });
    }

    async function renderAll() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (const id of COMBOS) {
        const [species, status] = id.split('-');
        const card = document.createElement('div');
        card.className = 'card';

        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.textContent = `${species === 'perro' ? '🐕' : '🐈'} ${STATUS[status][0]}`;
        card.appendChild(lbl);

        const wrap = document.createElement('div');
        wrap.className = 'canvas-wrap';
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        wrap.appendChild(c);
        card.appendChild(wrap);
        grid.appendChild(card);

        const bgImg = await getBg(id);
        if (!bgImg) { ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H); continue; }

        // 1. Background
        ctx.drawImage(bgImg, 0, 0, W, H);

        // 2. Pet photo
        if (testImg) {
          const iw = testImg.naturalWidth || 400;
          const ih = testImg.naturalHeight || 300;
          const scale = Math.min(W / iw, H / ih);
          ctx.drawImage(testImg, (W - iw * scale) / 2, (H - ih * scale) / 2, iw * scale, ih * scale);
        }

        // 3. Status bar
        const [label, color] = STATUS[status] || ['MASCOTA','#6B7280'];
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.88;
        ctx.fillRect(0, H - BAR_H, W, BAR_H);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Arial,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, W / 2, H - BAR_H / 2);

        // 4. Logo
        const r = LOGO_SIZE / 2;
        const cx = W - LOGO_SIZE - LOGO_PAD + r;
        const cy = LOGO_PAD + r;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = '#5A5A40';
        ctx.fillRect(cx - r, cy - r, LOGO_SIZE, LOGO_SIZE);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Arial,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('STH', cx, cy);
        ctx.restore();
      }
    }

    renderAll();
  </script>
</body>
</html>
